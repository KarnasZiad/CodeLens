# Local stack.
#   docker compose up -d                  PostgreSQL, MongoDB and Redis (run the apps with pnpm dev)
#   docker compose --profile app up -d    full stack built from the Dockerfile
# Databases listen on the loopback only and have no authentication: local development only.
name: codelens

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codelens
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: codelens
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codelens -d codelens']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # AOF: queued reviews survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/cli/migrate.js']
    environment:
      DATABASE_URL: postgresql://codelens:codelens@postgres:5432/codelens
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &environment
      NODE_ENV: production
      DATABASE_URL: postgresql://codelens:codelens@postgres:5432/codelens
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      GITHUB_WEBHOOK_SECRETS: ${GITHUB_WEBHOOK_SECRETS:?Set GITHUB_WEBHOOK_SECRETS in .env}
    ports:
      - '3000:3000'
    depends_on: &dependencies
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    environment:
      <<: *environment
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID in .env}
      GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_app_key
    secrets:
      - github_app_key
    depends_on: *dependencies
    restart: unless-stopped

secrets:
  github_app_key:
    file: ${GITHUB_PRIVATE_KEY_PATH:-./github-app.private-key.pem}

volumes:
  postgres-data:
  mongo-data:
  redis-data:
